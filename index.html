<!DOCTYPE html>
<html lang="es" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0A0C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Neiro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Neiro</title>
<meta name="description" content="Práctica de canto guiada: calentamiento, técnica, canciones y progreso">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/syne.woff2" as="font" type="font/woff2" crossorigin>
<script src="deshi.js"></script>
<style>
@font-face{font-family:'Syne';src:url(fonts/syne.woff2) format('woff2');font-weight:400 800;font-display:swap}

/* ── colores: claro por defecto, oscuro con el sistema o a mano ── */
:root{
  --bg:#F2F2F6;--bg2:#FFFFFF;--bg3:#E7E7EC;--sheet:#F2F2F6;--sheet2:#FFFFFF;
  --label:#0B0B10;--label2:rgba(60,60,67,.68);--label3:rgba(60,60,67,.38);
  --sep:rgba(60,60,67,.16);--fill:rgba(120,120,128,.20);--fill2:rgba(120,120,128,.12);
  --tint:#C8F57A;--on-tint:#10160A;--ink:#4A7A12;--tint-soft:rgba(140,198,63,.20);
  --warn:#E3A12F;--amber:#9A5F0C;--amber-soft:rgba(214,155,42,.16);--red:#D93F32;--red-soft:rgba(217,63,50,.12);
  --glass:rgba(255,255,255,.82);--glass-edge:rgba(255,255,255,.95);--glass-hi:rgba(255,255,255,.6);
  --shade:rgba(30,30,60,.14);--floor:rgba(30,30,60,.12);--scrim:rgba(0,0,0,.28);
  --belt:#efe9dc;
  /* guía del piano (escalera y teclado) */
  --g-now:#8CC63F;--g-done:rgba(140,198,63,.30);--g-bar:rgba(120,120,128,.24);--g-row:rgba(120,120,128,.07);
  --g-mark:rgba(140,198,63,.34);--g-markb:#55752C;
  --kw:#F0F0F4;--kb:#2E2E36;--kedge:rgba(60,60,67,.30);--kname:rgba(60,60,67,.62);--kdeg:#1E3A06;--kbt:#FFFFFF;
  /* tu voz encima de la guía: naranja translúcido, para que se vea sin tapar la escalera */
  --g-voz:rgba(255,128,0,.62);--g-voz-dot:#F57F00;--g-voz-soft:rgba(255,140,0,.14);--g-voz-ink:#B85400;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0A0C;--bg2:#17171B;--bg3:#232328;--sheet:#131316;--sheet2:#1F1F24;
  --label:#F5F5F9;--label2:rgba(235,235,245,.64);--label3:rgba(235,235,245,.36);
  --sep:rgba(235,235,245,.12);--fill:rgba(120,120,128,.34);--fill2:rgba(120,120,128,.22);
  --tint:#C8F57A;--on-tint:#10160A;--ink:#C8F57A;--tint-soft:rgba(200,245,122,.14);
  --warn:#F5C87A;--amber:#F5C87A;--amber-soft:rgba(245,200,122,.15);--red:#FF6B5E;--red-soft:rgba(255,107,94,.16);
  --glass:rgba(36,36,41,.76);--glass-edge:rgba(255,255,255,.16);--glass-hi:rgba(255,255,255,.08);
  --shade:rgba(0,0,0,.55);--floor:rgba(0,0,0,.55);--scrim:rgba(0,0,0,.55);
  --g-now:#C8F57A;--g-done:rgba(200,245,122,.30);--g-bar:rgba(120,120,128,.40);--g-row:rgba(120,120,128,.11);
  --g-mark:rgba(200,245,122,.50);--g-markb:#4F6B2A;
  --kw:#B4B4BE;--kb:#232329;--kedge:rgba(0,0,0,.45);--kname:rgba(16,16,20,.62);--kdeg:#10160A;--kbt:#F5F5F9;
  --g-voz:rgba(255,159,10,.68);--g-voz-dot:#FF9F0A;--g-voz-soft:rgba(255,159,10,.17);--g-voz-ink:#FFB347;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0A0C;--bg2:#17171B;--bg3:#232328;--sheet:#131316;--sheet2:#1F1F24;
  --label:#F5F5F9;--label2:rgba(235,235,245,.64);--label3:rgba(235,235,245,.36);
  --sep:rgba(235,235,245,.12);--fill:rgba(120,120,128,.34);--fill2:rgba(120,120,128,.22);
  --tint:#C8F57A;--on-tint:#10160A;--ink:#C8F57A;--tint-soft:rgba(200,245,122,.14);
  --warn:#F5C87A;--amber:#F5C87A;--amber-soft:rgba(245,200,122,.15);--red:#FF6B5E;--red-soft:rgba(255,107,94,.16);
  --glass:rgba(36,36,41,.76);--glass-edge:rgba(255,255,255,.16);--glass-hi:rgba(255,255,255,.08);
  --shade:rgba(0,0,0,.55);--floor:rgba(0,0,0,.55);--scrim:rgba(0,0,0,.55);
  --g-now:#C8F57A;--g-done:rgba(200,245,122,.30);--g-bar:rgba(120,120,128,.40);--g-row:rgba(120,120,128,.11);
  --g-mark:rgba(200,245,122,.50);--g-markb:#4F6B2A;
  --kw:#B4B4BE;--kb:#232329;--kedge:rgba(0,0,0,.45);--kname:rgba(16,16,20,.62);--kdeg:#10160A;--kbt:#F5F5F9;
  --g-voz:rgba(255,159,10,.68);--g-voz-dot:#FF9F0A;--g-voz-soft:rgba(255,159,10,.17);--g-voz-ink:#FFB347;
  color-scheme:dark}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--label);overscroll-behavior-y:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:22px;letter-spacing:-.43px;-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;min-height:100dvh;touch-action:manipulation;
}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;cursor:pointer;text-align:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
a{color:inherit;text-decoration:none}
svg{display:block;flex-shrink:0}
[hidden]{display:none!important}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
@media (pointer:coarse){input,select,textarea{font-size:17px}}

/* ── tipografía (escala de iOS) ── */
.lt{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.37px}
.t1{font-size:28px;line-height:34px;font-weight:700;letter-spacing:.36px}
.t2{font-size:22px;line-height:28px;font-weight:700;letter-spacing:.35px}
.t3{font-size:20px;line-height:25px;font-weight:600;letter-spacing:.38px}
.hl{font-size:17px;line-height:22px;font-weight:600}
.bd{font-size:17px;line-height:22px}
.sb{font-size:15px;line-height:20px;letter-spacing:-.23px}
.fn{font-size:13px;line-height:18px;letter-spacing:-.08px}
.c1{font-size:12px;line-height:16px;letter-spacing:0}
.semi{font-weight:600}.bold{font-weight:700}
.l2{color:var(--label2)}.l3{color:var(--label3)}.ink{color:var(--ink)}.amb{color:var(--amber)}.red{color:var(--red)}
.num{font-variant-numeric:tabular-nums}
.rnd{font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
.brand{font-family:Syne,-apple-system,sans-serif;font-weight:800;letter-spacing:-.4px}
.caps{text-transform:uppercase;letter-spacing:.5px}
.center{text-align:center}
.balance{text-wrap:balance}

/* ── estructura ── */
.app{max-width:440px;margin:0 auto;position:relative;min-height:100dvh}
.view{display:none;padding:calc(env(safe-area-inset-top) + 50px) 0 calc(env(safe-area-inset-bottom) + 120px)}
.view.on{display:block}
.view.with-acc{padding-bottom:calc(env(safe-area-inset-bottom) + 186px)}
.head{padding:0 20px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.head .sub{margin-top:2px}
.sec{padding:26px 0 0}
.stitle{display:flex;align-items:baseline;justify-content:space-between;padding:0 20px 10px;gap:12px}
.pad{padding:0 16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.topbtn{position:fixed;top:calc(env(safe-area-inset-top) + 8px);z-index:20}
.topbar-right{right:max(16px,calc(50% - 204px))}
.topbar-right2{right:max(64px,calc(50% - 156px))}
.themebtn{color:var(--label)}
.themebtn svg{transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .2s}
.themebtn.spin svg{transform:rotate(-90deg) scale(.6);opacity:0}
::view-transition-old(root),::view-transition-new(root){animation-duration:.32s}

/* ── cristal ── */
.glass{
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:inset 0 0 0 .5px var(--glass-edge),inset 0 1px 0 var(--glass-hi),0 8px 28px var(--shade);
}

/* ── botones ── */
.btn{height:54px;border-radius:27px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4}
.btn.pri{background:var(--tint);color:var(--on-tint)}
.btn.sec{background:var(--fill2);color:var(--label)}
.btn.inv{background:var(--label);color:var(--bg)}
.btn.tx{height:44px;color:var(--ink)}
.btn.danger{color:var(--red)}
.btn.lg{height:60px;border-radius:30px;font-size:18px}
.btn.sm{height:36px;width:auto;padding:0 14px;font-size:14px;border-radius:18px}
.ibtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--label);flex-shrink:0}
.ibtn:active{transform:scale(.92)}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:600;letter-spacing:0;white-space:nowrap}
.pill.tint{background:var(--tint-soft);color:var(--ink)}
.pill.amb{background:var(--amber-soft);color:var(--amber)}
.pill.plus{background:var(--tint);color:var(--on-tint)}
.pill.gray{background:var(--fill2);color:var(--label2)}
.link{color:var(--ink);font-weight:600}

/* ── tarjetas y listas ── */
.card{background:var(--bg2);border-radius:26px}
.group{background:var(--bg2);border-radius:22px;overflow:hidden}
.cell{display:flex;align-items:stretch;padding-left:16px;min-height:52px;width:100%;text-align:left}
.cell .ic{align-self:center;margin-right:13px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}
.cell .cb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:11px 16px 11px 0;border-top:.5px solid transparent}
.cell + .cell .cb{border-top-color:var(--sep)}
.cell .tt{flex:1;min-width:0}
.cell .val{color:var(--label2);white-space:nowrap}
.cell:active{background:var(--fill2)}
.cell.static:active{background:none}
.chev{color:var(--label3)}
.ic.tint{background:var(--tint);color:var(--on-tint)}
.ic.soft{background:var(--tint-soft);color:var(--ink)}
.ic.gray{background:var(--fill2);color:var(--label2)}
.ic.red{background:var(--red-soft);color:var(--red)}
.exn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--fill2);font-size:13px;font-weight:600;color:var(--label2);flex-shrink:0;align-self:center;margin-right:13px}
.exn.done{background:var(--tint);color:var(--on-tint)}
.ghead{padding:0 32px 7px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--label2)}
.gfoot{padding:7px 32px 0;font-size:13px;line-height:18px;color:var(--label2)}
.ell{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.empty{padding:22px 18px;text-align:center;color:var(--label2);font-size:15px;line-height:20px}

/* ── interruptor ── */
.sw{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex-shrink:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.16);transition:left .2s}
.sw.on{background:#34C759}.sw.on::after{left:22px}

/* ── segmentado ── */
.segc{display:flex;padding:2px;border-radius:10px;background:var(--fill2)}
.segc button{flex:1;height:32px;border-radius:8px;font-size:14px;font-weight:500;color:var(--label)}
.segc button.on{background:var(--bg2);box-shadow:0 3px 8px rgba(0,0,0,.12);font-weight:600}

/* ── barra de pestañas ── */
.tabbar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);height:64px;padding:4px;border-radius:32px;display:flex;gap:2px;z-index:30}
.tab{width:100px;height:56px;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--label);font-size:10px;line-height:12px;font-weight:600;letter-spacing:.1px}
.tab.on{color:var(--ink);background:var(--fill2)}
.accessory{position:fixed;left:50%;transform:translateX(-50%);width:min(400px,calc(100% - 32px));bottom:calc(env(safe-area-inset-bottom) + 88px);height:58px;border-radius:29px;display:flex;align-items:center;gap:11px;padding:0 8px 0 9px;z-index:30;text-align:left}

/* ── semana ── */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.day{display:flex;flex-direction:column;align-items:center;gap:7px}
.day .dl{font-size:12px;line-height:14px;font-weight:600;color:var(--label3)}
.day .dc{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:600;color:var(--label3);font-variant-numeric:tabular-nums}
.day .dc.done{background:var(--tint);color:var(--on-tint)}
.day .dc.today{box-shadow:inset 0 0 0 2px var(--tint);color:var(--label)}
.day .dc.done.today{box-shadow:none}
.day .dc.plan{box-shadow:inset 0 0 0 1.5px var(--fill);color:var(--label2)}
.day .dc.skip{color:var(--label3);text-decoration:line-through}
.day .dot{width:4px;height:4px;border-radius:2px}
.day .dot.on{background:var(--label3)}
.day .dot.tint{background:var(--ink)}
.day.today .dl{color:var(--ink)}

/* ── Deshi ── */
.dk{position:relative;flex-shrink:0;display:flex;align-items:flex-end;justify-content:center}
.dk .floor{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);width:110%;height:10px;border-radius:50%;background:radial-gradient(closest-side,var(--floor),transparent)}
.dk .deshi{position:relative;z-index:1}
.avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;display:grid;place-items:center}
.avatar .deshi{margin-top:6px}

/* ── hojas ── */
.scrim{position:fixed;inset:0;touch-action:none;background:var(--scrim);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:440px;max-height:calc(100dvh - env(safe-area-inset-top) - 14px);
  background:var(--sheet);border-radius:38px 38px 0 0;z-index:60;display:flex;flex-direction:column;transition:transform .32s cubic-bezier(.2,.9,.25,1);
  padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:translate(-50%,0)}
.sheet .group,.sheet .card{background:var(--sheet2)}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--fill);margin:6px auto 0;flex-shrink:0}
.shead{height:52px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;padding:0 64px}
.shead .l{position:absolute;left:14px}.shead .r{position:absolute;right:14px}
.sbody{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 0 24px;flex:1}
.grabber{position:relative}.grabber::after{content:'';position:absolute;left:-30px;right:-30px;top:-10px;bottom:-12px}
.sheet.drag{transition:none}
body.locked{position:fixed;left:0;right:0;overflow:hidden}
.ok-btn{width:38px;height:38px;background:var(--tint);color:var(--on-tint)}
.x-btn{width:38px;height:38px;background:var(--fill2);color:var(--label2)}

/* ── pantalla completa (bienvenida, onboarding, sesión) ── */
.full{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;overflow-y:auto}
.full.on{display:block}
.fullin{max-width:440px;margin:0 auto;min-height:100dvh;position:relative;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 20px calc(env(safe-area-inset-bottom) + 20px)}
.fnav{height:44px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.dots{display:flex;gap:6px}
.dots i{display:block;height:6px;border-radius:3px;background:var(--fill);flex:1}
.dots i.on{background:var(--tint)}
.dots i.now{background:var(--label2)}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:12px 16px;border-radius:20px;background:var(--bg2);text-align:left}
.opt .gi{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--fill2);color:var(--label2);flex-shrink:0}
.opt .ck{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--fill);flex-shrink:0;color:var(--bg)}
.opt.on{background:var(--tint-soft);box-shadow:inset 0 0 0 2px var(--ink)}
.opt.on .gi{background:var(--tint);color:var(--on-tint)}
.opt.on .ck{background:var(--ink);box-shadow:none}
.daysel{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.daysel button{height:52px;border-radius:16px;background:var(--bg2);font-weight:600;font-size:16px;color:var(--label2);text-align:center}
.daysel button.on{background:var(--tint);color:var(--on-tint)}
.foot{margin-top:auto;padding-top:20px;display:flex;flex-direction:column;gap:8px}
.nxbtn{display:flex;align-items:center;gap:12px;width:100%;margin-top:6px;padding:12px 14px 12px 16px;border-radius:22px;background:var(--fill2);color:var(--label);text-align:left;transition:transform .12s}
.nxbtn:active{transform:scale(.98)}
.nxbtn .pi{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--tint-soft);color:var(--ink);flex-shrink:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--label2);padding:0 4px}
.field input{height:50px;border-radius:14px;border:0;background:var(--bg2);padding:0 16px;font-size:17px;outline:none}
.sheet .field input{background:var(--sheet2)}
.field input:focus{box-shadow:inset 0 0 0 2px var(--ink)}
.tick{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:18px;color:var(--label2);cursor:pointer}
.tick input{width:20px;height:20px;flex-shrink:0;accent-color:#7BB33A;margin-top:-1px}
.msg{min-height:18px;font-size:13px;line-height:18px;color:var(--red)}
.msg.ok{color:var(--ink)}

/* ── sesión ── */
.step{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--fill2);color:var(--label);flex-shrink:0}
.step:active{transform:scale(.93)}
.big{font-size:76px;line-height:84px;font-weight:700;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.chips3{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chips3 > div{padding:10px 14px;border-radius:18px;background:var(--fill2);text-align:center;min-width:92px}
.setp{display:flex;gap:5px}
.setp i{display:block;width:22px;height:6px;border-radius:3px;background:var(--fill)}
.setp i.now{background:var(--label)}.setp i.on{background:var(--tint)}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg3 button{border-radius:16px;padding:10px 6px 9px;background:var(--fill2);text-align:center;display:flex;flex-direction:column;gap:2px}
.seg3 button.on{background:var(--tint-soft);box-shadow:inset 0 0 0 1.5px var(--ink)}
.seg3 button.on .hl{color:var(--ink)}
.ring{position:relative;flex-shrink:0}
.ring>svg{transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px;gap:2px}
.mini{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);color:var(--label)}
.anncard{background:var(--bg2);border-radius:30px;padding:18px 18px 16px}

/* ── progreso ── */
.beltbar{display:flex;gap:3px;margin-top:14px}
.beltbar i{display:block;flex:1;height:8px;border-radius:2px;background:var(--fill2)}
.beltbar i.on{background:var(--belt)}
.chart{position:relative;margin-top:16px}
.lock{opacity:.55}

/* ── avisos ── */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translate(-50%,-140%);z-index:90;padding:12px 18px;border-radius:22px;
  font-size:15px;font-weight:600;max-width:calc(100% - 32px);text-align:center;transition:transform .3s cubic-bezier(.2,.9,.25,1);pointer-events:none}
.toast.on{transform:translate(-50%,0)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:18px;background:var(--amber-soft);color:var(--label);font-size:14px;line-height:19px}
.note b{color:var(--amber)}
.prose{padding:0 20px;font-size:16px;line-height:23px;color:var(--label)}
.prose p+p{margin-top:12px}
.prose b{font-weight:600}
.prose ul{padding-left:20px;margin-top:8px}.prose li+li{margin-top:6px}
.prose h4{font-size:17px;margin:18px 0 6px}
.tech img{width:100%;border-radius:18px;display:block;background:#fff}

/* ══════ NEIRO ══════ */
.ta{width:100%;min-height:84px;border:0;border-radius:14px;background:var(--bg2);padding:12px 14px;font-size:16px;line-height:21px;resize:vertical;outline:none}
.sheet .ta{background:var(--sheet2)}
.ta:focus{box-shadow:inset 0 0 0 2px var(--ink)}
.field select{height:50px;border-radius:14px;border:0;background:var(--sheet2);padding:0 14px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
.ic.rec{background:var(--red-soft);color:var(--red)}
.ic.amb{background:var(--amber-soft);color:var(--amber)}
/* grabadora */
.recbtn{width:132px;height:132px;border-radius:50%;margin:14px auto 0;display:grid;place-items:center;box-shadow:inset 0 0 0 4px var(--red);transition:transform .15s}
.recbtn:active{transform:scale(.95)}
.recbtn i{display:block;width:96px;height:96px;border-radius:50%;background:var(--red);transition:all .25s cubic-bezier(.2,.9,.25,1)}
.recbtn.on i{width:46px;height:46px;border-radius:12px}
.lvl{height:6px;border-radius:3px;background:var(--fill2);overflow:hidden;max-width:220px;margin:16px auto 0}
.lvl i{display:block;height:100%;width:0;background:var(--tint);border-radius:3px;transition:width .08s}
/* escala de 5 */
.seg5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.seg5 button{border-radius:16px;padding:9px 2px 8px;background:var(--fill2);text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.seg5 button .n{font-size:19px;line-height:22px;font-weight:700}
.seg5 button .s{font-size:10.5px;line-height:13px;color:var(--label2)}
.seg5 button.on{background:var(--tint);color:var(--on-tint)}
.seg5 button.on .s{color:var(--on-tint);opacity:.8}
.seg5.sm button{padding:7px 2px}
.seg5.sm button .n{font-size:16px}
/* piano de referencia */
.player{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 10px;border-radius:24px;background:var(--bg2)}
.playbtn{width:52px;height:52px;border-radius:50%;background:var(--tint);color:var(--on-tint);display:grid;place-items:center;flex-shrink:0}
.playbtn:active{transform:scale(.94)}
.playbtn.on{background:var(--label);color:var(--bg)}

/* ── reproductor con guía: escalera (vertical) o teclado (horizontal) ── */
.pcard{border-radius:24px;background:var(--bg2);padding:12px 10px 10px;display:flex;flex-direction:column;gap:10px}
.pcard>.player{background:none;border-radius:0;padding:10px 0 0;border-top:.5px solid var(--sep)}
/* práctica con piano y guía: cabe en una pantalla */
.fullin.cmp .sstt{font-size:26px;line-height:31px}
.foot.cmp{padding-top:12px;gap:6px}
.foot.cmp .fbtn{height:42px;border-radius:21px;font-size:15px}
.mtimer.sm{height:42px;padding:0 14px;border-radius:21px;flex-shrink:0}
.nxbtn.sm{margin-top:0;padding:7px 12px 7px 10px;border-radius:18px;gap:10px}
.nxbtn.sm .pi{width:30px;height:30px}
.nxbtn.sm .hl{font-size:15px;line-height:19px}
.btn.fnx{height:50px}
/* «Cómo se hace» plegable */
.howd{border-radius:16px;background:var(--sheet2)}
.howd.ss{background:var(--bg2);margin-top:12px}
.howd summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;cursor:pointer}
.howd summary::-webkit-details-marker{display:none}
.howd .hwt{flex-shrink:0}.howd .hwp{flex:1;min-width:0}
.howd .chev{transition:transform .2s;flex-shrink:0}
.howd[open] .chev{transform:rotate(90deg)}.howd[open] .hwp{visibility:hidden}
.howd p{padding:0 14px 13px;white-space:pre-wrap}
/* cómo se practica un ejercicio propio */
.cxmodo{display:flex;flex-direction:column;gap:8px}
.cxm{display:flex;flex-direction:column;gap:2px;padding:11px 14px 11px 42px;border-radius:14px;background:var(--sheet2);position:relative;text-align:left}
.cxm::before{content:'';position:absolute;left:14px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--fill)}
.cxm.on{box-shadow:inset 0 0 0 2px var(--ink)}
.cxm.on::before{background:var(--tint);box-shadow:inset 0 0 0 5px var(--tint),inset 0 0 0 9px var(--on-tint)}
/* ejercicio propio: notas de la hoja */
.cxbox{display:flex;flex-direction:column;gap:12px;padding:12px;border-radius:18px;background:var(--sheet2)}
.cxseq{display:flex;flex-wrap:wrap;align-items:center;gap:5px 4px;min-height:44px;max-height:176px;overflow-y:auto;padding:2px}
.cxempty{padding:12px 4px}
.cxinfo{flex-basis:100%;padding:4px 2px 0}
.cxn{--w:1;position:relative;height:38px;width:calc(var(--w)*30px + (var(--w) - 1)*4px);min-width:26px;border-radius:10px;background:var(--fill2);color:var(--label);display:grid;place-items:center;font:600 12.5px/1 "DM Sans",-apple-system,system-ui,sans-serif;transition:background .12s,box-shadow .12s}
.cxn b{position:relative;font-weight:600}
.cxn.r{background:none;box-shadow:inset 0 0 0 1.5px var(--fill)}
.cxn.sel{background:var(--tint);color:var(--on-tint);box-shadow:none}
.cxn.sel .cxrest{background:var(--on-tint)}
.cxbar{width:1.5px;height:30px;border-radius:1px;background:var(--label3);opacity:.55;margin:0 3px}
b.up::before,b.lo::after{content:'';position:absolute;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
b.up::before{top:-6px}b.lo::after{bottom:-6px}
.cxrest{display:inline-block;width:12px;height:4px;border-radius:2px;background:var(--label3)}
.btn .cxrest{margin-right:2px;background:currentColor;opacity:.6}
.cxdur button{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px}
.cxdg{--w:1;display:inline-block;height:6px;width:calc(var(--w)*6px + 2px);max-width:26px;border-radius:3px;background:currentColor;opacity:.45}
.cxdur button.on .cxdg{background:var(--ink);opacity:1}
.cxkbw{overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px;scrollbar-width:none}
.cxkbw::-webkit-scrollbar{display:none}
.cxkb{position:relative;display:flex;min-width:470px;height:118px}
.cxw{flex:1;margin:0 1px;border-radius:0 0 9px 9px;background:var(--kw);box-shadow:inset 0 0 0 .5px var(--kedge);display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;color:var(--kname);font:600 11px/1 "DM Sans",-apple-system,system-ui,sans-serif;transition:background .08s}
.cxw.do{color:var(--kdeg)}.cxw.do b{font-weight:800}
.cxw b{position:relative}
.cxk{position:absolute;top:0;width:4.2%;height:60%;border-radius:0 0 6px 6px;background:var(--kb);z-index:1;transition:background .08s}
.cxw:active{background:var(--tint)}.cxk:active{background:var(--ink)}
.cxsm{height:44px;font-size:15px}
.cxvel button{text-align:center}
/* pentagrama de los ejercicios propios */
.gpg{padding:6px 2px 0;border-top:.5px solid var(--sep);margin-top:2px}
.gstaff{width:100%;height:auto;display:block;color:var(--label)}
.pgl{stroke:var(--label2);stroke-width:.8}.pgl.b{stroke-width:1}
.pgfill{fill:var(--label)}
.pgf{fill:var(--label)}.pgh{fill:none;stroke:var(--label);stroke-width:1.5}
.pgst{stroke:var(--label);stroke-width:1.1}.pgbeam{stroke:var(--label);stroke-width:3.6}
.pgflag,.pgrest{fill:none;stroke:var(--label);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pgacc{font:600 11px "DM Sans",-apple-system,system-ui,sans-serif;fill:var(--label);text-anchor:middle}
.pgts{font:700 19px Georgia,"Times New Roman",serif;fill:var(--label);text-anchor:middle}
.pglab{font:600 10.5px "DM Sans",-apple-system,system-ui,sans-serif;fill:var(--label2)}.pgof{fill:var(--label3);font-weight:500}
.pgclef{color:var(--label)}
.pgcur{fill:var(--tint-soft);transition:opacity .15s}
.pgn.now .pgf{fill:var(--ink)}.pgn.now .pgh{stroke:var(--ink);stroke-width:2.2}.pgn.now .pgst,.pgn.now .pgflag{stroke:var(--ink)}
.guide{display:flex;flex-direction:column;gap:8px}
.ghd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 4px}
.ghd .pill{min-width:0;overflow:hidden;text-overflow:ellipsis}
.gtop{text-align:right;flex-shrink:0}
.gsvg{width:100%;height:auto}
.gpat{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.gghost{animation:gfade 1.3s ease-out forwards}
@keyframes gfade{from{opacity:.9}to{opacity:0}}
/* tu voz encima de la guía */
.gvozl{fill:none;stroke:var(--g-voz);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.gvozl.old{stroke-width:2;animation:gfade 1.3s ease-out forwards}
.gvozd{fill:var(--g-voz-dot);stroke:var(--bg2);stroke-width:1.5;pointer-events:none;transition:opacity .15s}
.gvozk{fill:var(--g-voz);pointer-events:none;transition:opacity .15s}
.gvoz{display:flex;align-items:center;gap:7px;min-height:20px;padding:0 4px}
.gvoz i{width:16px;height:3px;border-radius:2px;background:var(--g-voz-dot);flex-shrink:0}
.gvoz .vn{color:var(--g-voz-ink);min-width:34px}
.gvoz .vs{min-width:0;flex:1;text-align:right}
.gvoz .link{color:var(--g-voz-ink)}
.mini.vozb{background:var(--fill2);color:var(--label2);transition:background .15s,color .15s}
.mini.vozb.on{background:var(--g-voz-soft);color:var(--g-voz-ink)}
.gdeg{font:600 9.5px ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;fill:var(--label2);text-anchor:middle}
.gdeg.now{fill:var(--ink);font-weight:800}
.gklab{font:500 8px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;fill:var(--label3);text-anchor:end}
.gtag{font:500 8px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;fill:var(--label3);text-anchor:middle}
.gseq{display:flex;flex-wrap:wrap;align-items:center;gap:3px;padding:0 4px}
.gseq span{min-width:23px;height:24px;padding:0 5px;border-radius:12px;display:inline-grid;place-items:center;background:var(--fill2);color:var(--label2);font:600 13px/1 ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-variant-numeric:tabular-nums;transition:background .12s,color .12s}
.gseq span.wd{padding:0 9px;font:600 12px/1 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}
.gseq span.done{background:var(--g-done);color:var(--label)}
.gseq span.now{background:var(--g-now);color:var(--on-tint)}
.gseq i{width:1px;height:16px;background:var(--sep);margin:0 3px}
.gseq b{font-weight:500;font-size:12px;color:var(--label3)}
.gkbd{cursor:pointer}
.gkname{font:500 8.5px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;fill:var(--kname);text-anchor:middle}
.gkdeg{font:700 12px ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;fill:var(--kdeg);text-anchor:middle}
.gkdeg.blk{font-size:11px;fill:var(--kbt)}
.gkdeg.now{fill:var(--on-tint)}
.mtimer{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:20px;background:var(--fill2)}
.mtimer.done{background:var(--tint-soft);color:var(--ink)}
.mtimer.done .fn,.mtimer.done .c1{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.gpat{transition:none}.gghost{animation:none;opacity:0}}
/* respiración */
.breath{width:200px;height:200px;border-radius:50%;margin:0 auto;display:grid;place-items:center;position:relative}
.breath::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--tint-soft);transform:scale(var(--b,.55));transition:transform 1s linear}
.breath::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 2px var(--fill)}
.breath .in{position:relative;z-index:1;text-align:center}
/* afinador */
.tuner{padding:16px 16px 14px;border-radius:26px;background:var(--bg2);text-align:center}
.tgauge{position:relative;height:44px;margin:12px 6px 0}
.tgauge .scale{position:absolute;left:0;right:0;top:20px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--red-soft),var(--fill2) 30%,var(--fill2) 70%,var(--red-soft))}
.tgauge .zone{position:absolute;top:18px;height:8px;border-radius:4px;background:var(--tint);opacity:.9}
.thold{height:6px;border-radius:3px;background:var(--fill2);overflow:hidden;margin:14px 6px 0}
.thold i{display:block;height:100%;border-radius:3px;background:var(--tint);transition:width .1s linear}
.thold.done i{background:var(--ink)}
.tgauge .mid{position:absolute;left:50%;top:6px;width:2px;height:32px;margin-left:-1px;background:var(--label3);border-radius:1px}
.tgauge .needle{position:absolute;left:50%;top:10px;width:16px;height:24px;margin-left:-8px;border-radius:8px;background:var(--label);transition:left .12s,background .2s}
.tgauge .needle.ok{background:var(--ink)}
.tnote{font-size:58px;line-height:64px;font-weight:700;letter-spacing:-1px}
/* gráfica de rango */
.rangebar{position:relative;height:30px;border-radius:15px;background:var(--fill2);margin-top:12px}
.rangebar i{position:absolute;top:4px;bottom:4px;border-radius:11px;background:var(--tint)}
.qbar{height:6px;border-radius:3px;background:var(--fill2);overflow:hidden;margin-top:10px}
.qbar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.goalbox{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--fill);display:grid;place-items:center;flex-shrink:0;align-self:center;margin-right:13px;color:var(--on-tint)}
.goalbox.ok{background:var(--tint);box-shadow:none}
.goalbox.pause{box-shadow:inset 0 0 0 1.5px var(--label3);opacity:.6}
.strike{text-decoration:line-through;text-decoration-color:var(--label3)}
audio{width:100%;height:40px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <button class="topbtn topbar-right2 avatar glass themebtn" id="btnTheme" onclick="toggleTheme()" hidden></button>
  <button class="topbtn topbar-right avatar glass" id="btnMe" onclick="openMe()" aria-label="Tú: perfil y ajustes" hidden></button>
  <main>
    <section class="view" id="v-hoy" aria-label="Hoy"></section>
    <section class="view" id="v-progreso" aria-label="Progreso"></section>
    <section class="view" id="v-estudio" aria-label="Estudio"></section>
  </main>
  <button class="accessory glass" id="acc" onclick="expandSession()" hidden></button>
  <nav class="tabbar glass" id="tabbar" aria-label="Secciones" hidden>
    <button class="tab" data-v="hoy" onclick="go('hoy')">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>Hoy</button>
    <button class="tab" data-v="progreso" onclick="go('progreso')">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5h16"/><path d="M5 15.5l4.5-4.5 3.2 3.2L19 8"/><path d="M14.8 8H19v4.2"/></svg>Progreso</button>
    <button class="tab" data-v="estudio" onclick="go('estudio')">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5.5l10-2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>Estudio</button>
  </nav>
</div>

<div class="full" id="welcome"></div>
<div class="full" id="onb"></div>
<div class="full" id="session"></div>

<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<div class="toast glass" id="toast" role="status" aria-live="polite"></div>

<script src="core.js"></script>
<script src="data.js"></script>
<script src="audio.js"></script>
<script src="escalera.js"></script>
<script src="pentagrama.js"></script>
<script src="app.js"></script>
</body>
</html>
